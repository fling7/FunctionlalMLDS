name: Build reframed IUI paper PDF

on:
  push:
    branches:
      - paper/iui2027-reframed
    paths:
      - "research/iui2027/paper_reframed/**"
      - "research/iui2027/paper/references.bib"
      - "research/iui2027/paper/figures/unity-model-grounded-selection.png"
      - ".github/workflows/build-iui-reframed-pdf.yml"

permissions:
  contents: write

concurrency:
  group: build-iui-reframed-pdf
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile ACM review manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: research/iui2027/paper_reframed
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Publish compiled PDF on the paper branch
        shell: bash
        run: |
          set -euo pipefail
          source_pdf="research/iui2027/paper_reframed/main.pdf"
          target_pdf="research/iui2027/paper_reframed/iui2027-reframed.pdf"
          test -s "$source_pdf"
          cp "$source_pdf" "$target_pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target_pdf"
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged."
          else
            git commit -m "Add compiled PDF for reframed IUI paper [skip ci]"
            git push origin HEAD:paper/iui2027-reframed
          fi
