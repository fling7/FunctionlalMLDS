name: Build IUI user-study paper PDF

on:
  push:
    branches:
      - paper/iui2027-userstudy
    paths:
      - ".github/workflows/build-iui-userstudy-pdf.yml"
      - "research/iui2027/paper_userstudy/*.tex"
      - "research/iui2027/paper_userstudy/sections/*.tex"
      - "research/iui2027/paper_userstudy/figures/*"
      - "research/iui2027/paper/references.bib"
      - "research/iui2027/paper/figures/unity-model-grounded-selection.png"

concurrency:
  group: iui-userstudy-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-publish-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile ACM review manuscript and count words
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: research/iui2027/paper_userstudy
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          post_compile: |
            awk '/\\appendix/{exit} {print}' main.tex > main-no-appendix.tex
            printf '\n\\end{document}\n' >> main-no-appendix.tex
            texcount -merge -sum -total main-no-appendix.tex | tee word-count-no-appendix.txt
            rm -f main-no-appendix.tex

      - name: Check table, figure, and cross-reference coverage
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          root = Path("research/iui2027/paper_userstudy")
          paths = [root / "main.tex", *sorted((root / "sections").glob("*.tex")), *sorted((root / "figures").glob("*.tex"))]
          text = "\n".join(path.read_text(encoding="utf-8") for path in paths)
          text = re.sub(r"(?<!\\)%.*", "", text)

          labels = re.findall(r"\\label\{([^}]+)\}", text)
          refs = set(re.findall(r"\\(?:ref|pageref|autoref|cref|Cref)\{([^}]+)\}", text))
          counts = Counter(labels)
          duplicates = sorted(label for label, count in counts.items() if count > 1)
          undefined = sorted(ref for ref in refs if ref not in counts)
          unreferenced_floats = sorted(
              label for label in counts
              if label.startswith(("fig:", "tab:")) and label not in refs
          )

          if duplicates or undefined or unreferenced_floats:
              if duplicates:
                  print("Duplicate labels:", duplicates)
              if undefined:
                  print("Undefined references:", undefined)
              if unreferenced_floats:
                  print("Unreferenced figure/table labels:", unreferenced_floats)
              sys.exit(1)

          print(f"Checked {len(labels)} labels and {len(refs)} references; all figure/table labels are referenced.")
          PY

      - name: Prepare self-contained Overleaf source
        shell: bash
        run: |
          set -euo pipefail
          src="research/iui2027/paper_userstudy"
          shared="research/iui2027/paper"
          pkg="build/iui2027-overleaf"
          verify="build/iui2027-overleaf-verify"

          rm -rf "$pkg" "$verify"
          mkdir -p "$pkg/sections" "$pkg/figures"

          cp "$src/main.tex" "$pkg/main.tex"
          cp "$src/references_userstudy.bib" "$pkg/references_userstudy.bib"
          cp "$shared/references.bib" "$pkg/references.bib"
          cp "$src/sections/"*.tex "$pkg/sections/"
          cp "$src/figures/"* "$pkg/figures/"
          cp "$shared/figures/unity-model-grounded-selection.png" "$pkg/figures/"

          PKG="$pkg" python - <<'PY'
          from pathlib import Path
          import os

          pkg = Path(os.environ["PKG"])

          main = pkg / "main.tex"
          text = main.read_text(encoding="utf-8")
          old_bib = r"\bibliography{../paper/references,references_userstudy}"
          new_bib = r"\bibliography{references,references_userstudy}"
          if old_bib not in text:
              raise SystemExit("Expected bibliography path not found in main.tex")
          main.write_text(text.replace(old_bib, new_bib), encoding="utf-8")

          appendix = pkg / "sections" / "appendix.tex"
          text = appendix.read_text(encoding="utf-8")
          old_image = "../paper/figures/unity-model-grounded-selection.png"
          new_image = "figures/unity-model-grounded-selection.png"
          if old_image not in text:
              raise SystemExit("Expected shared image path not found in appendix.tex")
          appendix.write_text(text.replace(old_image, new_image), encoding="utf-8")

          remaining = []
          for path in pkg.rglob("*.tex"):
              if "../paper/" in path.read_text(encoding="utf-8"):
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f"Non-self-contained paths remain: {remaining}")
          PY

          cat > "$pkg/README_OVERLEAF.md" <<'EOF'
          # Overleaf package

          1. Upload `IUI2027_Overleaf_Source.zip` as a new Overleaf project.
          2. Set `main.tex` as the main document.
          3. Use pdfLaTeX and the newest available TeX Live version (preferably TeX Live 2025).
          4. Overleaf provides the ACM `acmart` class and runs BibTeX automatically.

          The package is self-contained: all section files, BibTeX databases, TikZ sources, and raster images referenced by the manuscript are included. The source package is compiled in GitHub Actions before publication.
          EOF

          cp -R "$pkg" "$verify"

      - name: Compile self-contained Overleaf source
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: build/iui2027-overleaf-verify
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Create Overleaf source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build/iui2027-overleaf
          zip -q -r ../IUI2027_Overleaf_Source.zip .
          test -s ../IUI2027_Overleaf_Source.zip
          unzip -l ../IUI2027_Overleaf_Source.zip

      - name: Publish compiled PDF
        shell: bash
        run: |
          set -euo pipefail
          source_pdf="research/iui2027/paper_userstudy/main.pdf"
          target_pdf="research/iui2027/paper_userstudy/iui2027-userstudy.pdf"
          test -s "$source_pdf"
          cp "$source_pdf" "$target_pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target_pdf"
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged."
          else
            git commit -m "Build IUI user-study manuscript PDF [skip ci]"
            git push origin HEAD:paper/iui2027-userstudy
          fi

      - name: Upload manuscript PDF and word count
        uses: actions/upload-artifact@v4
        with:
          name: iui2027-userstudy-pdf
          path: |
            research/iui2027/paper_userstudy/main.pdf
            research/iui2027/paper_userstudy/word-count-no-appendix.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload self-contained Overleaf source
        uses: actions/upload-artifact@v4
        with:
          name: iui2027-overleaf-source
          path: build/IUI2027_Overleaf_Source.zip
          if-no-files-found: error
          retention-days: 7
