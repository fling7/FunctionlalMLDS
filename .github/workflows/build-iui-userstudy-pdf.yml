name: Build IUI user-study paper PDF

on:
  push:
    branches:
      - paper/iui2027-userstudy
    paths:
      - ".github/workflows/build-iui-userstudy-pdf.yml"
      - "research/iui2027/paper_userstudy/*.tex"
      - "research/iui2027/paper_userstudy/sections/*.tex"
      - "research/iui2027/paper/references.bib"
      - "research/iui2027/paper/figures/unity-model-grounded-selection.png"

permissions:
  contents: write

jobs:
  build-publish-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile ACM review manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: research/iui2027/paper_userstudy
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Publish compiled PDF
        shell: bash
        run: |
          set -euo pipefail
          source_pdf="research/iui2027/paper_userstudy/main.pdf"
          target_pdf="research/iui2027/paper_userstudy/iui2027-userstudy.pdf"
          test -s "$source_pdf"
          cp "$source_pdf" "$target_pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target_pdf"
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged."
          else
            git commit -m "Build IUI user-study manuscript PDF [skip ci]"
            git push origin HEAD:paper/iui2027-userstudy
          fi

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: iui2027-userstudy-pdf
          path: research/iui2027/paper_userstudy/main.pdf
          if-no-files-found: error
          retention-days: 7
