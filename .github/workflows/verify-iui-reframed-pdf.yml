name: Verify reframed IUI paper PDF

on:
  push:
    branches:
      - paper/iui2027-reframed
    paths:
      - ".github/workflows/verify-iui-reframed-pdf.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Compile ACM review manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: research/iui2027/paper_reframed
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload rendered manuscript
        uses: actions/upload-artifact@v4
        with:
          name: iui2027-reframed-verified
          path: research/iui2027/paper_reframed/main.pdf
          if-no-files-found: error
          retention-days: 1
