server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Unity template and loader filenames are not content-hashed and are
    # overwritten by every WebGL build. Force revalidation so a deployment
    # cannot be combined with a stale template from an earlier build.
    location = /BuildOutput/TemplateData/style.css {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* ^/BuildOutput/Build/[^/]+\.loader\.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.wasm\.br$ {
        gzip off;
        default_type application/wasm;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        try_files $uri =404;
    }

    location ~* \.js\.br$ {
        gzip off;
        default_type text/javascript;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        try_files $uri =404;
    }

    location ~* \.(data|mem|symbols)\.br$ {
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:html?|json|map|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
