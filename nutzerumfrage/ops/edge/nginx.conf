user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=npc_runtime:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=npc_audio:10m rate=10r/m;

    upstream study_web {
        server study-web:8080;
        keepalive 16;
    }

    upstream survey_api {
        server survey-api:3001;
        keepalive 16;
    }

    upstream npc_api {
        server npc-api:8787;
        keepalive 16;
    }

    upstream legacy_app {
        server legacy-app:8080;
        keepalive 8;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name forschungifai.informatik.fh-nuernberg.de www.forschungifai.informatik.fh-nuernberg.de forschungifai;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;
        server_name forschungifai.informatik.fh-nuernberg.de www.forschungifai.informatik.fh-nuernberg.de forschungifai;
        absolute_redirect off;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /legacy {
            return 308 /legacy/;
        }

        location ^~ /legacy/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_redirect ~^/(.*)$ /legacy/$1;
            proxy_redirect ~^https?://[^/]+/(.*)$ /legacy/$1;
            proxy_pass http://legacy_app/;
        }

        location ~ ^/api/(?:responses(?:/.*)?|raffle-(?:eligibility|entry))$ {
            access_log off;
            client_max_body_size 1m;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 60s;
            proxy_pass http://survey_api;
        }

        location /api/ {
            client_max_body_size 1m;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 60s;
            proxy_pass http://survey_api;
        }

        location = /npc-api/health {
            limit_except GET OPTIONS { deny all; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Private-Network;
            proxy_pass http://npc_api/health;
        }

        location = /npc-api/version {
            limit_except GET OPTIONS { deny all; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Private-Network;
            proxy_pass http://npc_api/version;
        }

        # The WebGL iframe receives ?backend=/npc-api. Only the participant
        # runtime routes are public; authoring and mutation routes stay private.
        location = /npc-api/projects {
            limit_except GET OPTIONS { deny all; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Private-Network;
            proxy_pass http://npc_api/projects;
        }

        location ~ ^/npc-api/projects/[^/]+(?:/(?:functionalmlds-v2|knowledge))?$ {
            limit_except GET OPTIONS { deny all; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Private-Network;
            rewrite ^/npc-api(/.*)$ $1 break;
            proxy_pass http://npc_api;
        }

        location ~ ^/npc-api/(?:setup|chat)$ {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=npc_runtime burst=10 nodelay;
            client_max_body_size 16m;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Private-Network;
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            rewrite ^/npc-api(/.*)$ $1 break;
            proxy_pass http://npc_api;
        }

        location = /npc-api/stt {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=npc_audio burst=4 nodelay;
            client_max_body_size 32m;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Private-Network;
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            rewrite ^/npc-api(/.*)$ $1 break;
            proxy_pass http://npc_api;
        }

        location = /npc-api/tts {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=npc_audio burst=4 nodelay;
            client_max_body_size 32k;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Private-Network;
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_pass http://npc_api/tts;
        }

        location /npc-api/ {
            return 404;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://study_web;
        }
    }
}
